name: CI/CD Pipeline — Telco Churn MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Test — se ejecuta en cada push/PR
  # -----------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar reentrenamiento (genera modelos frescos)
        run: python scripts/retrain.py

      - name: Ejecutar tests
        run: PYTHONPATH=. pytest tests/ -v

  # -----------------------------------------------------------------------
  # Job 2: Retrain & Deploy — solo en push a main
  # -----------------------------------------------------------------------
  retrain-and-deploy:
    name: Retrain & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar reentrenamiento
        run: python scripts/retrain.py

      - name: Commit de artefactos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ metrics/
          git diff --staged --quiet || git commit -m "Auto-retrain: actualizar modelo y métricas [skip ci]"
          git push
