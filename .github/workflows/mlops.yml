name: MLOps Training Pipeline

on:
  workflow_dispatch:  # Permite ejecución manual o vía API REST

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Necesario para que el bot pueda hacer commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MLOps Training Script
        run: python scripts/train_unsupervised.py

      - name: Commit updated models and metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Actualización automática de modelos MLOps y métricas"
          file_pattern: "models/* metrics/* data/loyal_customers.csv"
          branch: main
